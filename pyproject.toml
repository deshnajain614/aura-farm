[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-farm"
version = "1.0.0"
description = "AURA-Farm: Autonomous Unified Robotic Agriculture Farm - Zero-Routine-Human-Intervention Hydroponic Farm Operating System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AURA-Farm Team", email = "info@aura-farm.ai"}
]
keywords = [
    "hydroponics",
    "robotics",
    "autonomous-farming",
    "ai-agriculture",
    "digital-twin",
    "iot-edge",
    "smart-farm"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
aura-farm = "aura_farm.main:main"
